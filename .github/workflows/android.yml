name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installa dipendenze
        run: npm ci

      - name: Costruisci il gioco e sincronizza Capacitor
        run: npm run build

      - name: Test del motore di gioco
        run: npm test

      - name: Chiave di firma (solo se configurata nei Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.FMV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fmv.keystore"
            echo "FMV_KEYSTORE=$RUNNER_TEMP/fmv.keystore" >> "$GITHUB_ENV"
          fi

      - name: Compila APK (debug, installabile subito) e release
        working-directory: android
        env:
          FMV_KEYSTORE_PASSWORD: ${{ secrets.FMV_KEYSTORE_PASSWORD }}
          FMV_KEY_ALIAS: ${{ secrets.FMV_KEY_ALIAS }}
          FMV_KEY_PASSWORD: ${{ secrets.FMV_KEY_PASSWORD }}
          FMV_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          if [ -n "$FMV_KEYSTORE" ]; then ./gradlew --no-daemon assembleRelease bundleRelease; fi
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/FM-Valdarno.apk
          if [ -n "$FMV_KEYSTORE" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../out/FM-Valdarno-firmato.apk
            cp app/build/outputs/bundle/release/app-release.aab ../out/FM-Valdarno-PlayStore.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FM-Valdarno-android
          path: out/

      - name: Pubblica l'APK nelle Release (scaricabile dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FM del Valdarno 1.0.${{ github.run_number }}
          body: |
            Scarica **FM-Valdarno.apk** dal telefono Android e aprilo per installarlo
            (la prima volta Android chiede di consentire l'installazione da questa fonte).
          files: out/*
